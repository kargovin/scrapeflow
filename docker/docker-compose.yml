services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrapeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapeflow}
      POSTGRES_DB: ${POSTGRES_DB:-scrapeflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scrapeflow']
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal's persistence — its own instance, not databases on the app one (ADR-009 §2a):
  # the schema is owned by temporal-sql-tool, not Alembic, and the data is in-flight work,
  # so it must be resettable/restorable independently of the app DB. Two databases inside
  # it: `temporal` (POSTGRES_DB) and `temporal_visibility` (the init script). The init
  # script runs once, only on an empty data volume.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
      - ./temporal-postgres/init.sql:/docker-entrypoint-initdb.d/01-visibility-db.sql:ro
    ports:
      - '5434:5432' # 5432 is the app DB; 5433 is taken by another project on this host
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal's schema step, split out of the server because the image that bundled it
  # (temporalio/auto-setup) is deprecated. One-shot: runs setup-schema + update-schema on both
  # databases and exits 0; the server waits for that exit. Compose re-runs it on every `up`,
  # which is the same "every start" behaviour the k8s init container has — a bump of
  # TEMPORAL_VERSION is applied by the next start. Shows as `exited (0)` in `compose ps`.
  # ⚠️ Same tag as `temporal`: the schema files this applies live in this image, and the
  # server expects the matching version. Bump the two together.
  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: temporal-postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      SQL_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal} # temporal-sql-tool reads this name
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ['/bin/sh']
    command: /scripts/setup-schema.sh

  # Temporal server — all four services (frontend / history / matching / worker) in one process,
  # standard SQL visibility, no Elasticsearch (ADR-009 §2). Stateless: everything it persists is
  # in temporal-postgres. Static config (this env) needs a restart to change; the dynamicconfig
  # file is re-read live.
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      POSTGRES_SEEDS: temporal-postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Immutable after the first start (persisted in cluster_metadata_info) — the image
      # default, written down so it is a decision. k8s sets the same value.
      NUM_HISTORY_SHARDS: 4
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - '7233:7233'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Registers the `scrapeflow` namespace with 30-day retention (ADR-009 §2c), or resets the
  # retention on an existing one. One-shot on the admin-tools image, which carries the
  # `temporal` CLI; re-runs on every `up` and is a no-op beyond re-setting retention.
  # Shows as `exited (0)` in `compose ps`. k8s: the scrapeflow-temporal-init Job.
  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      TEMPORAL_NAMESPACE_RETENTION: 720h
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ['/bin/sh']
    command: /scripts/create-namespace.sh

  # Temporal Web UI — http://localhost:8080. A write-capable control plane with no auth of its
  # own (ADR-009 §2b); in k8s it is ClusterIP only and reached by port-forward. Its own version
  # line — not TEMPORAL_VERSION.
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.54.1}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: scrapeflow
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - '8080:8080'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console UI
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # The delivery worker's read-only MinIO user (ADR-015 §4). One-shot on the mc image; re-runs on
  # every `up` and is a no-op beyond re-setting the password. Shows as `exited (0)` in `compose ps`.
  minio-users:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      DELIVERY_MINIO_USER: scrapeflow-delivery
      DELIVERY_MINIO_PASSWORD: ${DELIVERY_MINIO_PASSWORD:-scrapeflow_delivery_secret}
    volumes:
      - ./minio:/scripts:ro
    entrypoint: ['/bin/sh']
    command: /scripts/create-users.sh

  # ── API ─────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scrapeflow}:${POSTGRES_PASSWORD:-scrapeflow}@postgres:5432/${POSTGRES_DB:-scrapeflow}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_SECURE: 'false'
    volumes:
      - ../api/app:/app/app
      - ../api/tests:/app/tests
      - ../api/migrations:/app/migrations
      - ../api/scripts:/app/scripts
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../api/app
          target: /app/app
        - action: rebuild
          path: ../api/pyproject.toml
    # The crawl gate fixture (E.6).
    networks: [default, crawl-fixture]

  # Temporal workflow worker — a second entrypoint of the api image, not a separate service
  # (phase4-implementation-backlog A.5). No hot reload: restart it to pick up code changes.
  # stop_grace_period sits above the worker's 20 s graceful_shutdown_timeout, as k8s's 30 s
  # terminationGracePeriodSeconds does; Docker's 10 s default would SIGKILL mid-drain.
  workflow-worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    # The venv's python as PID 1, not `uv run` — see worker_main.py's SIGTERM note.
    command: /app/.venv/bin/python -m app.workflows.worker_main
    env_file:
      - ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
    volumes:
      - ../api/app:/app/app
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    # The crawl gate fixture (E.6).
    networks: [default, crawl-fixture]

  # ── Python Playwright worker ─────────────────────────────────────────────────

  playwright-worker-temporal:
    build:
      context: ../playwright-worker
    env_file:
      - ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      PLAYWRIGHT_MAX_WORKERS: '3'
      PLAYWRIGHT_DEFAULT_TIMEOUT_SECONDS: '60'
    depends_on:
      minio:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    # Above PLAYWRIGHT_GRACEFUL_SHUTDOWN_SECONDS (630): an in-flight scrape finishes before the kill.
    stop_grace_period: 660s
    restart: unless-stopped
    # The crawl gate fixture (E.6).
    networks: [default, crawl-fixture]

  llm-worker-temporal:
    build:
      context: ../llm-worker
    env_file:
      - ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      LLM_MAX_WORKERS: '3'
    depends_on:
      minio:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    # Above LLM_GRACEFUL_SHUTDOWN_SECONDS (400): an in-flight call finishes before the kill.
    stop_grace_period: 420s
    restart: unless-stopped
    # The pipeline gate's stand-in LLM endpoint (J.10).
    networks: [default, crawl-fixture]

  # ── Delivery worker (ADR-015 §4) ─────────────────────────────────────────────

  # Serves the `delivery` task queue: the sinks, their undos, the destination tests.
  # ⚠️ No env_file: ../.env holds DATABASE_URL and every other key. The destinations key is
  # interpolated — compose reads it from the shell or docker/.env (a link to ../.env works).
  delivery-worker:
    build:
      context: ../delivery-worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: scrapeflow-delivery
      MINIO_SECRET_KEY: ${DELIVERY_MINIO_PASSWORD:-scrapeflow_delivery_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      DESTINATION_ENCRYPTION_KEY: ${DESTINATION_ENCRYPTION_KEY:-}
    depends_on:
      minio-users:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    # Above DELIVERY_GRACEFUL_SHUTDOWN_SECONDS (75): an in-flight attempt finishes before the kill.
    stop_grace_period: 90s
    restart: unless-stopped
    # The gate fixtures' public-range names.
    networks: [default, crawl-fixture]

  # ── Go HTTP scraper worker ───────────────────────────────────────────────────

  # Serves the Scrape activity on the scrape-http task queue.
  http-worker-temporal:
    build:
      context: ../http-worker
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      FETCH_TIMEOUT_SECS: '30'
    depends_on:
      minio:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped
    # The crawl gate fixture (E.6).
    networks: [default, crawl-fixture]

  # ── Egress proxy (BUG-010 part 2) ────────────────────────────────────────────

  # Every worker fetch of a user-chosen address goes through it: it resolves the name once, refuses
  # any address that is not public unicast (a 407 with X-Smokescreen-Error), and connects to
  # the address it checked. Config: docker/egress/smokescreen.yaml.
  egress:
    image: ghcr.io/stripe/smokescreen:v1.0.1@sha256:e62052a184ce5ef97c32b00a32583fc5376d4ca5d9ec941cf9a4566eef0556e8
    command: [--config-file, /etc/smokescreen/smokescreen.yaml, --listen-port, '4750']
    volumes:
      - ./egress/smokescreen.yaml:/etc/smokescreen/smokescreen.yaml:ro
    restart: unless-stopped
    # The gate fixtures' public-range names resolve on crawl-fixture; internal names on default.
    networks: [default, crawl-fixture]

  # ── Crawl gate fixture site (E.6) ───────────────────────────────────────────
  # contracts/fixtures/crawl-site/README.md. Its own network sits in a public range, so the SSRF
  # check (unchanged) sees www./docs.crawlfixture.com as outside sites; on the default network
  # internal.crawlfixture.com resolves privately — the in-scope SSRF bait.
  crawl-fixture:
    image: nginx:1.27-alpine
    profiles: [gate]
    volumes:
      - ../contracts/fixtures/crawl-site/site:/usr/share/nginx/html:ro
    networks:
      default:
        aliases: [internal.crawlfixture.com]
      crawl-fixture:
        aliases: [www.crawlfixture.com, docs.crawlfixture.com]

  # The pipeline gate's shop, stand-in LLM and webhook receiver (J.10) — names on the public-range
  # network, so the SSRF checks pass them as they would a real site.
  pipeline-fixture:
    image: python:3.12-alpine
    profiles: [gate]
    command: python -u /fixture/server.py
    volumes:
      - ../contracts/fixtures/pipeline-gate:/fixture:ro
    networks:
      crawl-fixture:
        aliases: [shop.pipelinefixture.com, llm.pipelinefixture.com, hooks.pipelinefixture.com]

  # The delivery gate's TLS front (bucket, webhook receiver, Postgres), SMTP sink and CA (M.12, O.1) — names on the
  # public-range network. The workers trust its CA only under docker/delivery-gate.yml.
  delivery-fixture:
    build:
      context: ../delivery-worker
    profiles: [gate]
    user: root
    command: python -u /fixture/server.py
    volumes:
      - ../contracts/fixtures/delivery-gate:/fixture:ro
      - delivery_gate_pki:/pki
    healthcheck:
      test: [CMD, python, -c, "import os; os.stat('/pki/bundle.pem')"]
      interval: 2s
      retries: 15
    networks:
      default:
      crawl-fixture:
        aliases:
          [s3.deliveryfixture.com, hooks.deliveryfixture.com, mail.deliveryfixture.com, pg.deliveryfixture.com]

  # The Postgres behind the delivery fixture's TLS front (O.1): a user's database. Fresh on every start;
  # every DDL statement is logged with its user, so the gate can see ScrapeFlow issued none.
  delivery-postgres:
    image: postgres:16-alpine
    profiles: [gate]
    environment:
      POSTGRES_PASSWORD: delivery-gate
    command: [postgres, -c, log_statement=ddl, -c, 'log_line_prefix=%u ']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      retries: 15

networks:
  default:
  crawl-fixture:
    ipam:
      config:
        - subnet: 11.222.33.0/24

volumes:
  postgres_data:
  temporal_postgres_data:
  redis_data:
  minio_data:
  delivery_gate_pki:
