services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrapeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapeflow}
      POSTGRES_DB: ${POSTGRES_DB:-scrapeflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scrapeflow']
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal's persistence — its own instance, not databases on the app one (ADR-009 §2a):
  # the schema is owned by temporal-sql-tool, not Alembic, and the data is in-flight work,
  # so it must be resettable/restorable independently of the app DB. Two databases inside
  # it: `temporal` (POSTGRES_DB) and `temporal_visibility` (the init script). The init
  # script runs once, only on an empty data volume.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
      - ./temporal-postgres/init.sql:/docker-entrypoint-initdb.d/01-visibility-db.sql:ro
    ports:
      - '5434:5432' # 5432 is the app DB; 5433 is taken by another project on this host
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal's schema step, split out of the server because the image that bundled it
  # (temporalio/auto-setup) is deprecated. One-shot: runs setup-schema + update-schema on both
  # databases and exits 0; the server waits for that exit. Compose re-runs it on every `up`,
  # which is the same "every start" behaviour the k8s init container has — a bump of
  # TEMPORAL_VERSION is applied by the next start. Shows as `exited (0)` in `compose ps`.
  # ⚠️ Same tag as `temporal`: the schema files this applies live in this image, and the
  # server expects the matching version. Bump the two together.
  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: temporal-postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      SQL_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal} # temporal-sql-tool reads this name
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ['/bin/sh']
    command: /scripts/setup-schema.sh

  # Temporal server — all four services (frontend / history / matching / worker) in one process,
  # standard SQL visibility, no Elasticsearch (ADR-009 §2). Stateless: everything it persists is
  # in temporal-postgres. Static config (this env) needs a restart to change; the dynamicconfig
  # file is re-read live.
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      POSTGRES_SEEDS: temporal-postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Immutable after the first start (persisted in cluster_metadata_info) — the image
      # default, written down so it is a decision. k8s sets the same value.
      NUM_HISTORY_SHARDS: 4
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - '7233:7233'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Registers the `scrapeflow` namespace with 30-day retention (ADR-009 §2c), or resets the
  # retention on an existing one. One-shot on the admin-tools image, which carries the
  # `temporal` CLI; re-runs on every `up` and is a no-op beyond re-setting retention.
  # Shows as `exited (0)` in `compose ps`. k8s: the scrapeflow-temporal-init Job.
  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.0}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: scrapeflow
      TEMPORAL_NAMESPACE_RETENTION: 720h
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ['/bin/sh']
    command: /scripts/create-namespace.sh

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data']
    volumes:
      - nats_data:/data
    ports:
      - '4222:4222' # client
      - '8222:8222' # monitoring
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 4222 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console UI
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NATS stream init (creates SCRAPEFLOW stream before API starts) ──────────

  nats-init:
    image: natsio/nats-box:latest
    restart: 'no'
    depends_on:
      nats:
        condition: service_healthy
    command: >
      sh -c "
        if nats stream info SCRAPEFLOW --server nats://nats:4222 >/dev/null 2>&1; then
          nats stream edit SCRAPEFLOW --subjects 'scrapeflow.jobs.>' --server nats://nats:4222 --force;
        else
          nats stream add SCRAPEFLOW --subjects 'scrapeflow.jobs.>' --retention work --storage file --replicas 1 --server nats://nats:4222 --defaults;
        fi
      "

  # ── API ─────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      target: test
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scrapeflow}:${POSTGRES_PASSWORD:-scrapeflow}@postgres:5432/${POSTGRES_DB:-scrapeflow}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_SECURE: 'false'
    volumes:
      - ../api/app:/app/app
      - ../api/tests:/app/tests
      - ../api/migrations:/app/migrations
      - ../api/scripts:/app/scripts
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ../api/app
          target: /app/app
        - action: rebuild
          path: ../api/pyproject.toml

  # ── Python Playwright worker ─────────────────────────────────────────────────

  playwright-worker:
    build:
      context: ../playwright-worker
    env_file:
      - ../.env
    environment:
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      PLAYWRIGHT_MAX_WORKERS: '3'
      PLAYWRIGHT_DEFAULT_TIMEOUT_SECONDS: '60'
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped

  llm-worker:
    build:
      context: ../llm-worker
    env_file:
      - ../.env
    environment:
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      LLM_MAX_WORKERS: '3'
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Go HTTP scraper worker ───────────────────────────────────────────────────

  http-worker:
    build:
      context: ../http-worker
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      FETCH_TIMEOUT_SECS: '30'
      NATS_MAX_DELIVER: '3'
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Crawl coordinator ───────────────────────────────────────────────────────

  coordinator:
    build:
      context: ../coordinator
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scrapeflow}:${POSTGRES_PASSWORD:-scrapeflow}@postgres:5432/${POSTGRES_DB:-scrapeflow}
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow_secret}
      MINIO_BUCKET: scrapeflow-results
      MINIO_SECURE: 'false'
      COORDINATOR_DISPATCH_BATCH_SIZE: '10'
      COORDINATOR_DISPATCH_POLL_INTERVAL: '2'
      COORDINATOR_STALE_THRESHOLD_MINUTES: '10'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_postgres_data:
  redis_data:
  nats_data:
  minio_data:
