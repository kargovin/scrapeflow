[project]
name = "playwright-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Patchright is a drop-in Playwright fork with the CDP Runtime.enable leak
    # patched and navigator.webdriver removed — see docs/adr for the stealth
    # rationale. It vendors a compatible Playwright, so we no longer pin it here.
    "patchright>=1.44.0",
    "nats-py>=2.7.0",
    "miniopy-async>=1.21.0",
    # aiohttp is miniopy-async's HTTP backend; declared explicitly because
    # worker/errors.py matches its connection-error types (UF-003 3a).
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.3.0",
    "markdownify>=0.12.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
