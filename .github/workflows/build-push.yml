name: Build & Push Docker Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── Detect which service directories changed ───────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      http-worker: ${{ steps.filter.outputs.http-worker }}
      playwright-worker: ${{ steps.filter.outputs.playwright-worker }}
      llm-worker: ${{ steps.filter.outputs.llm-worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'frontend/**'
            http-worker:
              - 'http-worker/**'
            playwright-worker:
              - 'playwright-worker/**'
            llm-worker:
              - 'llm-worker/**'

  # ── Workflow replay (ADR-012) ──────────────────────────────────────────────
  # The workflow worker ships in the api image: recorded histories must replay on this code, or a
  # deploy strands runs already in flight. Pure Python — no services.
  replay:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Replay recorded workflow histories
        run: |
          uv sync --frozen --extra dev --no-install-project
          key() { uv run --no-sync python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"; }
          export LLM_KEY_ENCRYPTION_KEY="$(key)" CREDENTIALS_ENCRYPTION_KEY="$(key)"
          uv run --no-sync pytest --noconftest tests/test_workflow_replay.py -q -p no:cacheprovider

  # ── API ────────────────────────────────────────────────────────────────────
  build-api:
    needs: [changes, replay]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push scrapeflow-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/scrapeflow-api:${{ github.ref_name }}-${{ steps.ts.outputs.ts }}-${{ github.sha }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

  # ── Go HTTP Worker ─────────────────────────────────────────────────────────
  build-http-worker:
    needs: changes
    if: needs.changes.outputs.http-worker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push scrapeflow-http-worker
        uses: docker/build-push-action@v5
        with:
          context: ./http-worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/scrapeflow-http-worker:${{ github.ref_name }}-${{ steps.ts.outputs.ts }}-${{ github.sha }}

  # ── Playwright Worker ──────────────────────────────────────────────────────
  build-playwright-worker:
    needs: changes
    if: needs.changes.outputs.playwright-worker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push scrapeflow-playwright-worker
        uses: docker/build-push-action@v5
        with:
          context: ./playwright-worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/scrapeflow-playwright-worker:${{ github.ref_name }}-${{ steps.ts.outputs.ts }}-${{ github.sha }}

  # ── LLM Worker ────────────────────────────────────────────────────────────
  build-llm-worker:
    needs: changes
    if: needs.changes.outputs.llm-worker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Build and push scrapeflow-llm-worker
        uses: docker/build-push-action@v5
        with:
          context: ./llm-worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/scrapeflow-llm-worker:${{ github.ref_name }}-${{ steps.ts.outputs.ts }}-${{ github.sha }}
