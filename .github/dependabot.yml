# Every dependency manifest in the repo (BUG-006); each has a committed lock its image installs from (BUG-013).
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /http-worker
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /llm-worker
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /playwright-worker
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /delivery-worker
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /mcp
    schedule:
      interval: weekly
