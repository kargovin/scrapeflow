[project]
name = "scrapeflow-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Capped below the next major: server.py uses 1.x's decorator API (Server.list_tools /
    # call_tool), which 2.x removed. Raise the cap by hand with a port of server.py.
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
scrapeflow-mcp = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
