[project]
name = "delivery-worker"
version = "0.1.0"
requires-python = ">=3.12"
# No ORM and no app code: this worker must not be able to reach the app database (ADR-015 §4).
# asyncpg is the Postgres sink's client only, upper-bounded: postgres.py relies on its TLS handshake.
dependencies = [
    "temporalio>=1.33.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",
    "structlog>=24.0.0",
    "aiohttp>=3.10.0",
    "miniopy-async>=1.23.0",
    "aiosmtplib>=5.1.0",
    "asyncpg>=0.31.0,<0.32",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
